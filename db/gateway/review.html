<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film production review</title>
<style>body{font:16px system-ui;background:#101827;color:#e5edf7;margin:2rem auto;max-width:1100px;padding:1rem}button,select,input{padding:.7rem;margin:.3rem;border-radius:6px}button{cursor:pointer}#assets{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem}article{background:#202c40;padding:1rem;border-radius:10px}img,video{width:100%;max-height:420px;object-fit:contain}pre{white-space:pre-wrap}#message{color:#ffd48b}</style>
<h1>Film production</h1><label>Project <select id="project"></select></label><button id="refresh">Refresh</button>
<p>Queue a stage, generate a small batch, then approve the resulting assets. OpenAI generation uses API credits.</p>
<div id="controls"></div><label>Batch size <input id="limit" type="number" value="1" min="1" max="100"></label><label>Episode for assembly <input id="episode" placeholder="Project-scoped episode ID"></label>
<p id="message" role="status"></p><pre id="status"></pre><pre id="run"></pre><h2>Asset review</h2><label>Asset status <select id="assetStatus"><option>candidate</option><option>approved</option><option>rejected</option></select></label><div id="assets"></div>
<script>
const $=id=>document.getElementById(id); let runId=null;
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');return data;}
function base(){return '/projects/'+encodeURIComponent($('project').value)}
async function refresh(){try{const [s,a]=await Promise.all([api(base()+'/status'),api(base()+'/review-assets?status='+$('assetStatus').value)]);$('status').textContent=s.jobs.map(j=>`${j.job_type}: ${j.status} (${j.count})`).join('\n');$('assets').replaceChildren();for(const asset of a.assets){const card=document.createElement('article'),title=document.createElement('p'),media=document.createElement(asset.asset_type==='shot_video'||asset.asset_type==='final_render'?'video':'img');title.textContent=`#${asset.id} ${asset.asset_type} â€” ${asset.entity_id||''}`;media.src=asset.preview_url;media.controls=true;media.alt=title.textContent;card.append(title,media);for(const state of ($('assetStatus').value==='candidate'?['approved','rejected']:[])){const b=document.createElement('button');b.textContent=state==='approved'?'Approve':'Reject';b.onclick=async()=>{try{await api(base()+`/assets/${asset.id}/review`,{status:state});await refresh()}catch(e){$('message').textContent=e.message}};card.append(b)}if(asset.status==='rejected'){const b=document.createElement('button');b.textContent='Queue new version';b.onclick=async()=>{try{await api(base()+`/assets/${asset.id}/regenerate`,{});$('message').textContent='New version queued. Start its image or video worker.'}catch(e){$('message').textContent=e.message}};card.append(b)}$('assets').append(card)}}catch(e){$('message').textContent=e.message}}
for(const [label,path,isWorker] of [['Advance pipeline','workers/pipeline',true],['Queue references','queue/references'],['Queue shot images','queue/shot-images'],['Generate with OpenAI','workers/openai-references',true],['Local canonical images','workers/comfy-references',true],['Queue videos','queue/shot-videos'],['Render local videos','workers/comfy-videos',true],['Assemble episode','workers/assembly',true]]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{try{const result=await api(base()+'/'+path,isWorker?{limit:Number($('limit').value),episode_id:$('episode').value||null}:{});if(result.id){runId=result.id;$('message').textContent='Worker started. Progress appears below.'}else $('message').textContent=result.output;await refresh()}catch(e){$('message').textContent=e.message}};$('controls').append(b)}
$('assetStatus').onchange=refresh;$('refresh').onclick=refresh;$('project').onchange=refresh;
async function poll(){if(!runId)return;try{const r=await api('/runs/'+runId);$('run').textContent=r.status+'\n'+r.output;if(r.status!=='running'){runId=null;await refresh()}}catch(e){$('message').textContent=e.message}}
api('/projects').then(data=>{for(const p of data.projects){const o=document.createElement('option');o.value=o.textContent=p.project_id;$('project').append(o)}if(data.projects.length)refresh();else $('message').textContent='No projects found.'}).catch(e=>$('message').textContent=e.message);setInterval(poll,3000);
</script></html>
